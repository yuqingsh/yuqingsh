name: render token usage

on:
  # re-render whenever the local collector pushes new data
  push:
    branches: [main]
    paths:
      - "data/usage.json"
      - "tools/render_svg.py"
  # daily fallback
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: render svg
        run: python3 tools/render_svg.py

      - name: commit rendered card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/token-usage.svg
          git diff --cached --quiet || git commit -m "chore: render token usage card [skip ci]"
          git push
